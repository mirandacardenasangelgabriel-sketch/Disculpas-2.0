<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti... 🤍</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Audio de fondo -->
    <audio id="background-music" loop>
        <source src="cancion.mp3" type="audio/mpeg">
        Tu navegador no soporta audio.
    </audio>

    <!-- 1. PANTALLA DEL SOBRE (INICIAL) -->
    <div id="envelope-container" class="envelope-screen">
        <div class="envelope" id="open-envelope-btn">
            <div class="envelope-flap"></div>
            <div class="envelope-body"></div>
            <div class="heart-seal">❤️</div>
        </div>
        <p class="envelope-text">Toca el sobre para abrirlo 💌</p>
    </div>

    <!-- 2. TARJETA PRINCIPAL (OCULTA HASTA ABRIR EL SOBRE) -->
    <div class="card hidden" id="main-card">
        <!-- Contenedor de Imagen o Video -->
        <div class="img-wrapper">
            <img id="imagen-cambio" src="img/triste.png" alt="Imagen disculpa">
        </div>

        <!-- Texto principal -->
        <h1 id="main-text">Hola... Sé que he estado fallando y quería pedirte una disculpa de corazón. 🥺</h1>

        <!-- Grupo de botones -->
        <div class="btn-group">
            <button id="yes-btn">Sí, te perdonaré</button>
            <button id="no-btn">No</button>
        </div>

        <!-- Botón de Postdata (oculto al inicio) -->
        <button id="pd-btn" class="hidden">Ver P.D. 💌</button>
    </div>

    <!-- Botón flotante para la música por si acaso -->
    <button id="music-toggle" class="music-btn hidden">🎵 Música</button>

    <script src="script.js"></script>
</body>
</html>
