<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Una disculpa de corazón 🥺</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- REPRODUCTOR DE MÚSICA (Audio de fondo) -->
    <audio id="bg-music" src="cancion.mp3" loop></audio>
    
    <!-- Botón flotante para pausar/reproducir la música -->
    <button id="music-btn" class="music-btn hidden">🎵</button>

    <!-- PANTALLA DEL SOBRE (Aparece al principio) -->
    <div id="envelope-container" class="envelope-container">
        <div class="envelope" id="envelope">
            <div class="flap"></div>
            <div class="body"></div>
            <div class="letter-preview">💌</div>
        </div>
        <p class="envelope-text">Tienes un mensaje... Toca para abrir 🔓</p>
    </div>

    <!-- CONTENIDO DE LA DISCULPA -->
    <div class="container hidden" id="main-content">
        <!-- Imagen chiquita arriba del texto -->
        <div class="img-wrapper">
            <img id="imagen-cambio" src="img/triste.png" alt="Imagen disculpa">
        </div>

        <h1 id="main-text">Perdón... sé que la regué y de verdad lo siento 💔</h1>
        
        <div class="btn-group" id="btn-group">
            <button id="yes-btn">Te perdono ❤️</button>
            <button id="no-btn">No 😔</button>
        </div>

        <!-- Botón de Postdata -->
        <button id="pd-btn" class="hidden">P.D. 💌</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
